name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.11 / ${{ matrix.os }} / ${{ matrix.support_level }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            support_level: required
            advisory: false
          - os: ubuntu-latest
            support_level: advisory
            advisory: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Check import boundaries
        run: lint-imports

      - name: Run tests
        run: pytest -q

      - name: Build distribution
        run: python -m build

      - name: Smoke test CLI
        shell: bash
        run: |
          labdaq --version
          labdaq diagnostics
          labdaq diagnostics --json
          python -m labdaq diagnostics --json
          labdaq profile validate src/labdaq/resources/config/hardware-profiles/cdaq-9171-ni-9239-four-channel-v1.json
          labdaq config validate tests/fixtures/configuration/valid-four-channel-synthetic-v1.json
          labdaq recipe validate src/labdaq/resources/config/processing-recipes/baseline-v1-draft.json
          labdaq hardware list --backend simulated --json
          labdaq hardware validate --backend simulated --profile src/labdaq/resources/config/hardware-profiles/cdaq-9171-ni-9239-four-channel-v1.json --experiment tests/fixtures/configuration/valid-four-channel-synthetic-v1.json --json
          labdaq hardware acquire-test --backend simulated --experiment tests/fixtures/configuration/valid-four-channel-synthetic-v1.json --scenario src/labdaq/resources/config/simulator-scenarios/clean-four-channel-v1.json --samples 1000 --chunk-size 257 --json
